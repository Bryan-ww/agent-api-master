# 本地开发基础设施一键启动（PostgreSQL + Redis + Qdrant）
# 用法：把本文件复制到仓库根目录（与 main.py 同级），然后执行：
#   docker compose up -d
# 查看状态： docker compose ps
# 停止：     docker compose down        （保留数据卷）
# 清空数据： docker compose down -v     （删除数据卷，慎用）
#
# 注意：默认账号密码与本仓库 src/settings.py 的默认值一致（postgres/postgres），
# 仅供本地开发使用。生产环境务必修改，并通过 .env 传入。

services:
  postgres:
    image: postgres:16-alpine
    container_name: aegra-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aegra-api
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aegra-api"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: aegra-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: aegra-qdrant
    ports:
      - "6333:6333"   # HTTP REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  redisdata:
  qdrantdata:
